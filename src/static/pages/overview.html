<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job overview - Renovate Operator</title>
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-small.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png" />

  <script src="js/tailwind.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: "#009bc5",
            "primary-hover": "#00556c",
            success: "#00c567",
            error: "#c22828",
            warning: "#ff8c1a",
          },
        },
      },
    };
  </script>
  <script src="js/theme-utils.js"></script>
  <script src="js/floating-utils.js"></script>
  <script src="js/babel.min.js"></script>
  <script src="js/babel-config.js"></script>
  <script type="module">
    import { React, createRoot, createPortal } from './js/react-bundle.esm.js';
    window.React = React;
    window.createRoot = createRoot;
    window.createPortal = createPortal;
  </script>
  <script type="module">
    import * as FloatingUI from './js/floating-ui.esm.js';
    window.FloatingUI = FloatingUI;
  </script>
  <script type="text/babel" src="components/Spinner.js"></script>
  <script type="text/babel" src="components/ThemeToggle.js"></script>
  <script type="text/babel" src="components/SiteHeader.js"></script>
  <script type="text/babel" src="components/StatBadge.js"></script>
  <script type="text/babel" src="components/Footer.js"></script>
  <script type="text/babel" src="components/Keycap.js"></script>
  <script type="text/babel" src="components/Tooltip.js"></script>

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-slate-100 transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    // The job overview (ui.jobOverview.enabled): one row per RenovateJob the user
    // can read, built by GET /api/v1/overview from the project statuses the
    // operator already keeps. A project's status describes its latest run, so the
    // figures describe the latest run of every project, not a history.
    const { useState, useEffect, useCallback } = React;

    // How many project names the problems tooltip lists before summarizing the rest.
    const PROBLEM_TOOLTIP_LIMIT = 10;
    const REFRESH_INTERVAL_MS = 30000;

    const STATUS_CLASSES = {
      completed: "text-success",
      failed: "text-error",
    };

    const formatTimeAgo = (timestamp) => {
      const diffInSeconds = Math.max(0, Math.floor((Date.now() - new Date(timestamp)) / 1000));
      if (diffInSeconds < 60) return `${diffInSeconds}s ago`;
      if (diffInSeconds < 3600) return `${Math.floor(diffInSeconds / 60)}m ago`;
      if (diffInSeconds < 86400) return `${Math.floor(diffInSeconds / 3600)}h ago`;
      return `${Math.floor(diffInSeconds / 86400)}d ago`;
    };

    const formatLocalTime = (timestamp) =>
      new Date(timestamp).toLocaleString(undefined, {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        timeZoneName: "short",
      });

    const formatRate = (rate) => (rate === undefined || rate === null ? "—" : `${Math.round(rate * 100)}%`);

    function ProblemsCell({ problems }) {
      if (problems.length === 0) {
        return <span className="text-gray-400 dark:text-slate-500 tabular-nums">0</span>;
      }
      const shown = problems.slice(0, PROBLEM_TOOLTIP_LIMIT);
      const hidden = problems.length - shown.length;
      return (
        <Tooltip
          content={
            <ul className="space-y-0.5">
              {shown.map((problem) => (
                <li key={problem.name} className="break-all">
                  <span className="font-mono">{problem.name}</span>{" "}
                  <span className="text-gray-300">
                    {problem.status === "failed"
                      ? "failed"
                      : `${problem.errorCount} ${problem.errorCount === 1 ? "error" : "errors"}`}
                  </span>
                </li>
              ))}
              {hidden > 0 && <li>and {hidden} more</li>}
            </ul>
          }
        >
          <span tabIndex={0} className="font-semibold text-error tabular-nums cursor-default">
            {problems.length}
          </span>
        </Tooltip>
      );
    }

    function LastRunCell({ lastRun }) {
      if (!lastRun) {
        return <span className="text-gray-400 dark:text-slate-500">No finished run yet</span>;
      }
      return (
        <div className="flex flex-wrap items-baseline gap-x-2 min-w-0">
          <Tooltip content={formatLocalTime(lastRun.finishedAt)}>
            <time dateTime={lastRun.finishedAt} className="tabular-nums" tabIndex={0}>
              {formatTimeAgo(lastRun.finishedAt)}
            </time>
          </Tooltip>
          <span className={`font-medium ${STATUS_CLASSES[lastRun.status] || ""}`}>{lastRun.status}</span>
          <span className="font-mono text-xs text-gray-500 dark:text-slate-400 break-all">{lastRun.project}</span>
          {lastRun.duration && (
            <span className="text-xs text-gray-400 dark:text-slate-500">{lastRun.duration}</span>
          )}
        </div>
      );
    }

    function JobRow({ job }) {
      const unavailable = !!job.error;
      const cellClass = "px-4 py-3 text-sm tabular-nums";
      return (
        <tr className="border-t border-gray-100 dark:border-slate-700/50">
          <th scope="row" className="px-4 py-3 text-left text-sm font-medium">
            <span className="text-gray-400 dark:text-slate-500 font-normal">{job.namespace}/</span>
            {job.name}
            {job.suspended && (
              <span className="ml-2 rounded px-1.5 py-0.5 text-[0.625rem] uppercase tracking-wider bg-gray-100 dark:bg-slate-700 text-gray-500 dark:text-slate-400">
                Suspended
              </span>
            )}
          </th>
          <td className={cellClass}>{unavailable ? "—" : job.projects}</td>
          <td className={cellClass}>{unavailable ? "—" : job.runs}</td>
          <td className={`${cellClass} ${job.failed > 0 ? "text-error font-semibold" : ""}`}>
            {unavailable ? "—" : formatRate(job.failureRate)}
          </td>
          <td className={cellClass}>{unavailable ? "—" : <ProblemsCell problems={job.projectsWithProblems || []} />}</td>
          <td className="px-4 py-3 text-sm">
            {unavailable
              ? <span className="text-error">Projects unavailable</span>
              : <LastRunCell lastRun={job.lastRun} />}
          </td>
        </tr>
      );
    }

    function App() {
      const BASE = window.__BASE_PATH__ || "";
      const [jobs, setJobs] = useState(null);
      const [error, setError] = useState(null);
      const [version, setVersion] = useState(null);
      const [authInfo, setAuthInfo] = useState(null);

      const loadOverview = useCallback(async () => {
        try {
          const response = await fetch(BASE + "/api/v1/overview");
          if (response.status === 401) {
            window.location.href = BASE + "/auth/login";
            return;
          }
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          setJobs(await response.json());
          setError(null);
        } catch (err) {
          setError(`Failed to load the job overview: ${err.message}`);
        }
      }, [BASE]);

      useEffect(() => {
        fetch(BASE + "/api/v1/version")
          .then((r) => (r.ok ? r.json() : null))
          .then((d) => d && setVersion(d.version))
          .catch(() => {});
        fetch(BASE + "/api/v1/auth/status")
          .then((r) => (r.ok ? r.json() : null))
          .then((d) => d && setAuthInfo(d))
          .catch(() => {});
      }, [BASE]);

      useEffect(() => {
        loadOverview();
        const interval = setInterval(loadOverview, REFRESH_INTERVAL_MS);
        return () => clearInterval(interval);
      }, [loadOverview]);

      const loaded = jobs !== null;
      const available = (jobs || []).filter((job) => !job.error);
      const totals = available.reduce(
        (sum, job) => ({
          runs: sum.runs + job.runs,
          failed: sum.failed + job.failed,
          problems: sum.problems + (job.projectsWithProblems || []).length,
        }),
        { runs: 0, failed: 0, problems: 0 }
      );

      return (
        <div className="min-h-screen flex flex-col">
          <SiteHeader version={version} authInfo={authInfo}>
            <StatBadge label="Jobs" value={loaded ? jobs.length : "—"} title="RenovateJobs you can read" />
            <StatBadge
              label="Runs"
              value={loaded ? totals.runs : "—"}
              title="Projects whose latest run finished"
            />
            <StatBadge
              label="Failed"
              value={loaded ? totals.failed : "—"}
              valueClass="text-error"
              title="Projects whose latest run failed"
            />
            <StatBadge
              label="Failure rate"
              value={loaded ? formatRate(totals.runs > 0 ? totals.failed / totals.runs : null) : "—"}
              title="Failed runs among the finished ones"
            />
            <StatBadge
              label="With problems"
              value={loaded ? totals.problems : "—"}
              valueClass="text-amber-500"
              borderClass="border-amber-300 dark:border-amber-600"
              title="Projects whose latest run failed or logged errors"
            />
          </SiteHeader>

          <main className="flex-1 max-w-7xl mx-auto w-full px-3 sm:px-6 lg:px-8 pb-8">
            <div className="mb-4 flex flex-wrap items-baseline justify-between gap-2">
              <h1 className="text-lg font-semibold text-gray-900 dark:text-slate-100">Job overview</h1>
              <a href={`${BASE}/`} className="text-sm text-primary hover:text-primary-hover">
                Back to the dashboard
              </a>
            </div>

            {error && (
              <div role="alert" className="mb-4 rounded-lg bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-800 p-4 text-red-700 dark:text-red-400 text-sm">
                {error}
              </div>
            )}

            {!loaded && !error && (
              <div className="flex items-center justify-center py-16 text-gray-500 dark:text-slate-400">
                <Spinner className="w-5 h-5 mr-2" />
                Loading the job overview…
              </div>
            )}

            {loaded && jobs.length === 0 && (
              <div className="text-center py-16 text-gray-400 dark:text-slate-500 text-sm">
                No RenovateJobs to show.
              </div>
            )}

            {loaded && jobs.length > 0 && (
              <div className="rounded-lg border border-gray-200 dark:border-slate-700 bg-white dark:bg-slate-800 overflow-x-auto">
                <table className="w-full" aria-label="RenovateJobs">
                  <thead className="bg-gray-50 dark:bg-slate-800/60 text-left text-[0.625rem] uppercase tracking-wider text-gray-500 dark:text-slate-400">
                    <tr>
                      <th scope="col" className="px-4 py-2 font-medium">Job</th>
                      <th scope="col" className="px-4 py-2 font-medium">Projects</th>
                      <th scope="col" className="px-4 py-2 font-medium">Runs</th>
                      <th scope="col" className="px-4 py-2 font-medium">Failure rate</th>
                      <th scope="col" className="px-4 py-2 font-medium">Problems</th>
                      <th scope="col" className="px-4 py-2 font-medium">Last run</th>
                    </tr>
                  </thead>
                  <tbody>
                    {jobs.map((job) => (
                      <JobRow key={`${job.namespace}/${job.name}`} job={job} />
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </main>
          <Footer />
        </div>
      );
    }

    window.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
