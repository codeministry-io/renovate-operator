---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: renovateprojects.renovate-operator.mogenius.com
spec:
  group: renovate-operator.mogenius.com
  names:
    kind: RenovateProject
    listKind: RenovateProjectList
    plural: renovateprojects
    shortNames:
    - rp
    singular: renovateproject
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.labels.renovate-operator\.mogenius\.com/renovatejob
      name: Job
      type: string
    - jsonPath: .spec.project
      name: Project
      type: string
    - jsonPath: .status.status
      name: Status
      type: string
    - jsonPath: .status.lastTransition
      name: Last Transition
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RenovateProjectSpec contains the immutable identity of the
              tracked repository.
            properties:
              project:
                description: Project is the full repository name as reported by the
                  git platform (e.g. "org/repo").
                type: string
                x-kubernetes-validations:
                - message: project is immutable
                  rule: self == oldSelf
            required:
            - project
            type: object
          status:
            description: RenovateProjectState captures the runtime status of one Renovate
              run for this repository.
            properties:
              duration:
                type: string
              executionOptions:
                properties:
                  baseBranch:
                    description: |-
                      If set, the renovate job runs once against this branch instead of the repository's
                      base branches, using the Renovate config found on that branch. Such a run is always
                      a dry run (RENOVATE_DRY_RUN=full).
                    maxLength: 250
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._/-]*$
                    type: string
                  debug:
                    description: If true, the renovate job will be executed with RENOVATE_LOG_LEVEL=debug
                    type: boolean
                  dryRun:
                    description: If true, the renovate job will be executed with RENOVATE_DRY_RUN=full
                    type: boolean
                type: object
              lastTransition:
                description: LastTransition records when the project most recently
                  changed state.
                format: date-time
                type: string
              logIssues:
                description: LogIssues contains aggregate counts and individual issue
                  messages from a Renovate run.
                properties:
                  abandonedCount:
                    description: |-
                      AbandonedCount is the number of dependencies Renovate flagged as abandoned
                      (abandonmentThreshold). Nil when the run had no debug logs, so the count is unknown.
                    type: integer
                  abandonedDependencies:
                    description: |-
                      AbandonedDependencies lists abandoned dependencies as "datasource/package",
                      sorted and capped; AbandonedCount exceeding its length means it was truncated.
                    items:
                      type: string
                    type: array
                  errorCount:
                    type: integer
                  hasConfigMigration:
                    type: boolean
                  issues:
                    items:
                      description: LogIssue represents a single warning or error from
                        Renovate logs.
                      properties:
                        level:
                          type: integer
                        message:
                          type: string
                      required:
                      - level
                      - message
                      type: object
                    type: array
                  truncated:
                    type: boolean
                  warnCount:
                    type: integer
                required:
                - errorCount
                - warnCount
                type: object
              prActivity:
                description: PRActivity contains aggregate counts and individual details
                  of PR activity from a run.
                properties:
                  automerged:
                    type: integer
                  created:
                    type: integer
                  needsApproval:
                    type: integer
                  prs:
                    items:
                      description: PRDetail represents a single PR found in Renovate
                        logs.
                      properties:
                        action:
                          description: PRAction represents what happened to a PR in
                            a Renovate run.
                          type: string
                        branch:
                          type: string
                        number:
                          type: integer
                        title:
                          type: string
                      required:
                      - action
                      - branch
                      type: object
                    type: array
                  truncated:
                    type: boolean
                  unchanged:
                    type: integer
                  updated:
                    type: integer
                required:
                - automerged
                - created
                - needsApproval
                - unchanged
                - updated
                type: object
              priority:
                format: int32
                type: integer
              renovateResultStatus:
                type: string
              securityFindings:
                description: SecurityFindings is only collected while the operator's
                  security view is enabled.
                properties:
                  findings:
                    items:
                      description: |-
                        SecurityFinding is one security update Renovate proposes for a repository,
                        read from the report of its latest run (see docs/operations/security-view.md).
                      properties:
                        advisoryIds:
                          description: |-
                            AdvisoryIDs lists the advisories the update fixes (e.g. "GHSA-..."). Renovate
                            logs them at debug level only, so they are empty for runs without debug logs.
                          items:
                            type: string
                          type: array
                        branch:
                          description: Branch is the branch Renovate uses for the
                            update.
                          type: string
                        branchResult:
                          description: BranchResult is Renovate's result for Branch
                            in that run, e.g. "pr-created" or "automerged".
                          type: string
                        currentVersion:
                          description: CurrentVersion is the affected version the
                            repository uses.
                          type: string
                        datasource:
                          type: string
                        manager:
                          description: Manager is the Renovate manager that found
                            the dependency, e.g. "npm".
                          type: string
                        newVersion:
                          description: NewVersion is the version the security update
                            moves to.
                          type: string
                        package:
                          description: Package is the dependency as Renovate names
                            it (depName).
                          type: string
                        prNumber:
                          description: PRNumber is the pull request of Branch; zero
                            when the run reported none.
                          type: integer
                        prTitle:
                          type: string
                      required:
                      - branch
                      - package
                      type: object
                    type: array
                  truncated:
                    type: boolean
                type: object
              status:
                type: string
            required:
            - status
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
